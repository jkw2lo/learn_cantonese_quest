<title>Cantonese Quest</title>
<!-- Without this a phone lays the page out at 980px and shrinks the result to
     fit, so every max-width block in css/app.css below 860px was unreachable:
     the bottom bar, the stacked dashboard and the two-up options had never
     once run on a real phone. viewport-fit=cover because the CSS already asks
     for env(safe-area-inset-bottom), which stays 0 without it. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- One version, stamped onto every asset URL below.
     A browser that has cached js/app.js will keep serving it until something
     about the URL changes, which is why a push can be live and invisible at
     the same time. Bump with: node tools/version.mjs <next>  -->
<script>const APP_VERSION = "0.23.15", APP_DATE = "2026-09-24";</script>
<!-- Loaded before every other script, including the CDN one below — the error
     it most needs to catch is one thrown while a data file is still parsing. -->
<script src="js/diag.js?v=0.23.15"></script>
<!-- Newsreader, not Fraunces, for one reason: the J.

     Fraunces draws a J that drops below the baseline and curls left, and the
     one heading that addresses you by name is the place it shows. It was
     blamed on the family's WONK axis and pinned to 0 — which was wrong.
     Rendered side by side at 54px, WONK 0 and WONK 1 are identical for "Jen",
     and so are ss01-ss04, salt, cv01 and cv02. That J is simply the font's J,
     and the only way past it is a different font.

     Newsreader keeps the editorial warmth and the optical-size axis, pairs
     with IBM Plex Sans as Fraunces did, and has an ordinary J. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css?v=0.23.15">

<div class="app">

  <header class="topbar">
    <!-- The wordmark is also the way back into the introduction: it is the one
         thing on the page that is obviously "the app itself". -->
    <button class="brand" id="brandBtn" title="About Cantonese, and how this works"
            aria-label="About Cantonese, and how this works">
      <span class="brand-seal" aria-hidden="true">粵</span>
      <span class="brand-name">Cantonese Quest</span>
    </button>
    <!-- Four groups, divided: the day and what it is for; practice you choose
         to do; things to look up; and your own history. -->
    <nav class="top-nav" aria-label="Sections">
      <button data-nav="today" class="on"><span class="nz">今日</span> Today</button>
      <button data-nav="menu"><span class="nz">餐牌</span> Menu</button>
      <span class="nav-sep" role="separator"></span>
      <button data-nav="sprint"><span class="nz">速練</span> Sprint</button>
      <button data-nav="write"><span class="nz">練字</span> Write</button>
      <span class="nav-sep" role="separator"></span>
      <button data-nav="library"><span class="nz">字庫</span> Library</button>
      <button data-nav="radicals"><span class="nz">部首</span> Radicals</button>
      <button data-nav="tones"><span class="nz">聲調</span> Tones</button>
      <span class="nav-sep" role="separator"></span>
      <button data-nav="record"><span class="nz">記錄</span> Record</button>
    </nav>
    <!-- The four-week tracker used to be a bar of its own under the top bar,
         saying 🔥 N beside a chip that already said 🔥 N. It lives behind this
         chip now: hover it, focus it, or tap it. -->
    <div class="streak-pop">
      <button class="chip chip-streak cold streak-chip" aria-haspopup="true" aria-expanded="false">🔥 0</button>
      <div class="tracker" id="tracker" role="note"></div>
    </div>
    <!-- Deliberately last in the row and the quietest thing in it: a guide you
         have to notice is worse than no guide, and a guide you cannot escape
         is worse again. -->
    <!-- Drawn, not typed. A text glyph in a 30px box is centred as a line box,
         and a line box reserves descender space the glyph never uses — so the
         question mark and the half-moon sat visibly high inside their borders.
         An inline SVG has no baseline to honour, so the grid centres the ink. -->
    <button class="icon-btn help-btn" id="helpBtn" title="How this page works" aria-label="How this page works">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M9.2 9.3a2.85 2.85 0 1 1 3.75 2.7c-.63.23-1.05.83-1.05 1.5v.6"/>
        <path d="M12 17.3h.01"/>
      </svg>
    </button>
    <!-- 💾 was a colour emoji between two line icons, at whatever size and
         baseline the platform's emoji font felt like. The same floppy, drawn
         in the same stroke as its neighbours. -->
    <button class="icon-btn save-btn" title="Save your progress to a file" aria-label="Save your progress to a file">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <path d="M17 21v-8H7v8"/>
        <path d="M7 3v5h8"/>
      </svg>
    </button>
    <!-- Drawn rather than typed. U+2699 renders as thin monochrome text and
         disappeared; ⚙️ with the emoji selector is a colour glyph that sits
         oddly on a pale bar next to two line icons. An inline SVG inherits
         currentColor and matches its neighbours in both themes. -->
    <button class="icon-btn settings-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 14.5a1.6 1.6 0 0 0 .32 1.77l.06.06a1.9 1.9 0 1 1-2.7 2.7l-.05-.06a1.6 1.6 0 0 0-1.77-.32
                 1.6 1.6 0 0 0-1 1.47v.17a1.9 1.9 0 1 1-3.8 0v-.09a1.6 1.6 0 0 0-1.05-1.47 1.6 1.6 0 0 0-1.77.32
                 l-.06.06a1.9 1.9 0 1 1-2.7-2.7l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-1H3.5a1.9 1.9
                 0 1 1 0-3.8h.09a1.6 1.6 0 0 0 1.47-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.9 1.9 0 1 1 2.7-2.7
                 l.06.06a1.6 1.6 0 0 0 1.77.32h.08a1.6 1.6 0 0 0 1-1.47V3.5a1.9 1.9 0 1 1 3.8 0v.09a1.6 1.6 0 0
                 0 1 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.9 1.9 0 1 1 2.7 2.7l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08
                 a1.6 1.6 0 0 0 1.47 1h.17a1.9 1.9 0 1 1 0 3.8h-.09a1.6 1.6 0 0 0-1.47 1z"/>
      </svg>
    </button>
    <button class="icon-btn theme-btn" title="Switch between light and dark" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </header>

  <!-- Eight sections never fitted a phone's bottom bar: it was drawn as seven
       columns and held eight buttons, so every label sat a little wrong. They
       live behind this instead. Fixed position, and deliberately a sibling of
       .topbar rather than a child of it: .topbar has its own backdrop-filter
       (the blur behind it), and a backdrop-filter on an ancestor becomes the
       containing block for a position: fixed descendant — this button would
       anchor to the bar's own small box instead of the viewport if it stayed
       inside. -->
  <button class="icon-btn burger" id="burgerBtn" aria-label="Sections"
          aria-expanded="false" aria-controls="drawer">
    <span class="burger-bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>

  <!-- 示範 — only ever visible while demo mode is on, and gone entirely when
       DEMO_BUILD is false in js/srs.js -->
  <div class="demo-bar" id="demoBar" hidden></div>

  <main>
    <section class="view on" id="viewToday"></section>
    <section class="view" id="viewSprint"></section>
    <section class="view" id="viewMenu"></section>
    <section class="view" id="viewLibrary"></section>
    <section class="view" id="viewWrite"></section>
    <section class="view" id="viewRadicals"></section>
    <section class="view" id="viewTones"></section>
    <section class="view" id="viewRecord"></section>
  </main>

</div>

<!-- sections, on a phone: the same four groups the desktop bar has, in one
     bottom sheet. Each button carries data-nav, so go() lights it and the
     single [data-nav] handler in app.js wires it without knowing it exists. -->
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Sections" hidden>
  <div class="drawer-veil" id="drawerVeil"></div>
  <div class="drawer-sheet">
    <span class="drawer-grip" aria-hidden="true"></span>
    <nav class="drawer-nav" aria-label="Sections">
      <button data-nav="today" class="on"><span class="nz">今日</span><span class="nl">Today</span></button>
      <button data-nav="menu"><span class="nz">餐牌</span><span class="nl">Menu</span></button>
      <span class="drawer-rule" role="separator"></span>
      <button data-nav="sprint"><span class="nz">速練</span><span class="nl">Sprint</span></button>
      <button data-nav="write"><span class="nz">練字</span><span class="nl">Write</span></button>
      <span class="drawer-rule" role="separator"></span>
      <button data-nav="library"><span class="nz">字庫</span><span class="nl">Library</span></button>
      <button data-nav="radicals"><span class="nz">部首</span><span class="nl">Radicals</span></button>
      <button data-nav="tones"><span class="nz">聲調</span><span class="nl">Tones</span></button>
      <span class="drawer-rule" role="separator"></span>
      <button data-nav="record"><span class="nz">記錄</span><span class="nl">Record</span></button>
    </nav>
  </div>
</div>

<!-- study session -->
<div class="session" id="session" role="dialog" aria-label="Study session">
  <div class="ses-bar">
    <button class="icon-btn" id="sesClose" aria-label="Close session">✕</button>
    <span class="ses-prog"><i id="sesProg"></i></span>
    <button class="muted-chip" id="muted" hidden title="Turn sound back on">🔇 sound off</button>
    <span class="combo zero" id="combo"><span class="han">連對</span>0</span>
    <span class="ses-count" id="sesCount"></span>
  </div>
  <div class="qtimer" id="qtimer" hidden><i></i></div>
  <div class="ses-body" id="sesBody">
    <div class="ses-inner" id="sesInner"></div>
  </div>
  <div class="ses-foot"><div class="ses-foot-inner" id="sesFoot"></div></div>
</div>

<!-- a timed sheet -->
<div class="session sprint" id="sprintRun" role="dialog" aria-label="Sprint sheet">
  <div class="ses-bar sp-bar">
    <button class="icon-btn" id="spClose" aria-label="Stop this sheet">✕</button>
    <span class="sp-mode" id="spMode"></span>
    <span class="sp-dots" id="spDots" aria-hidden="true"></span>
    <span class="ses-count" id="spCount"></span>
    <span class="sp-clock" id="spClock">0:00</span>
    <!-- Drawn, not the ⏸ glyph — a monospace pause sign sits at a different
         optical size in every font stack, so it's the two bars every other
         icon in this bar already is: an inline SVG that inherits currentColor
         and lines up with its neighbours. -->
    <button class="icon-btn sp-pause-btn" id="spPause" aria-label="Pause this sheet">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true">
        <rect x="6" y="5" width="4" height="14" rx="1"/>
        <rect x="14" y="5" width="4" height="14" rx="1"/>
      </svg>
    </button>
  </div>
  <div class="sp-drain" id="spDrain"><i></i></div>
  <div class="ses-body"><div class="ses-inner sp-inner" id="spInner"></div></div>
  <!-- Shown only via #sprintRun.paused (see sprintTogglePause in js/sprint.js)
       — a full veil rather than just stopping the clock, so nothing under it
       can still be tapped or typed into while the sheet is held. -->
  <div class="sp-pause-veil" id="spPauseVeil">
    <div class="sp-pause-card">
      <span class="sp-pause-k han">唞</span>
      <b>Paused</b>
      <p class="note">The clock's stopped. Resume when you're ready.</p>
      <button class="btn btn-seal" id="spResume">Resume</button>
    </div>
  </div>
</div>

<!-- character / menu detail -->
<div class="sheetview" id="charView" role="dialog" aria-label="Detail">
  <div class="sv-bar">
    <button class="icon-btn" id="svClose" aria-label="Back">←</button>
    <span class="sv-title" id="svTitle"></span>
  </div>
  <div class="sv-body" id="svBody"></div>
</div>

<!-- flashcards -->
<div class="flash" id="flash" role="dialog" aria-label="Flashcards">
  <div class="flash-bar">
    <button class="icon-btn" id="flashClose" aria-label="Close flashcards">✕</button>
    <span class="sv-title" id="flashTitle"></span>
    <span class="flash-count" id="flashCount"></span>
  </div>
  <div class="flash-stage" id="flashStage"></div>
  <div class="flash-foot">
    <div class="flash-foot-inner">
      <button class="btn btn-ghost" id="flashPrev">Back</button>
      <button class="btn" id="flashNext">Next</button>
    </div>
    <p class="flash-keys"><kbd>space</kbd> hear it &nbsp;·&nbsp;
      <kbd>space</kbd> <kbd>space</kbd> next card &nbsp;·&nbsp;
      <kbd>hold space</kbd> peek at the back</p>
    <!-- the same three things, for a thumb: only one of these two lines is
         ever on screen, and which one is a question about the pointer -->
    <p class="flash-taps">tap to hear it &nbsp;·&nbsp; hold to peek at the back &nbsp;·&nbsp; swipe on</p>
  </div>
</div>

<!-- celebration -->
<div class="cheer" id="cheer" aria-hidden="true">
  <div class="cheer-card">
    <span class="cheer-seal" id="cheerSeal"></span>
    <span class="cheer-zh" id="cheerZh"></span>
    <span class="cheer-en" id="cheerEn"></span>
  </div>
  <div class="cheer-bits" id="cheerBits"></div>
</div>

<!-- placement quiz -->
<div class="place" id="place" role="dialog" aria-label="Where to start">
  <div class="place-bar">
    <button class="icon-btn" id="placeClose" aria-label="Close">✕</button>
    <span class="place-prog"><i id="placeProg"></i></span>
    <span class="place-count" id="placeCount"></span>
  </div>
  <div class="place-body" id="placeBody"></div>
</div>

<!-- confirm, in the page: the sandbox an artifact runs in has no allow-modals,
     so window.confirm() there returns false without ever asking -->
<div class="ask" id="ask" role="dialog" aria-modal="true" aria-labelledby="askTitle">
  <div class="ask-card">
    <div class="ask-body">
      <span class="ask-k han" id="askK" aria-hidden="true"></span>
      <h2 id="askTitle"></h2>
      <p id="askBody"></p>
    </div>
    <div class="ask-foot">
      <button class="btn btn-ghost btn-sm" id="askNo">Cancel</button>
      <button class="btn btn-sm" id="askYes">Confirm</button>
    </div>
  </div>
</div>

<!-- first-run tour -->
<div class="tour" id="tour" role="dialog" aria-label="Welcome">
  <div class="tour-card">
    <div class="tour-body" id="tourBody"></div>
    <div class="tour-foot">
      <button class="btn btn-ghost btn-sm" id="tourSkip">Skip</button>
      <span style="flex:1"></span>
      <button class="btn btn-ghost btn-sm" id="tourBack" hidden>Back</button>
      <button class="btn btn-sm" id="tourNext">Next</button>
    </div>
  </div>
</div>

<!-- The introduction: a hello, then what Cantonese is, then how this app
     goes about teaching it. Three stages, each waiting for Next, and reachable
     again from the wordmark. -->
<div class="intro" id="intro" role="dialog" aria-label="Introduction" hidden>
  <div class="intro-card" id="introCard"></div>
</div>

<!-- The quick-start overlay: three numbered steps pointed at the real page
     rather than at a picture of it. Reopened by the ? in the top bar, and
     never opened by itself after the first time. -->
<div class="coach" id="coach" role="dialog" aria-label="How this page works" hidden>
  <div class="coach-veil"></div>
  <div class="coach-ring" id="coachRing"></div>
  <div class="coach-card" id="coachCard"></div>
</div>

<!-- milestone -->
<div class="hail" id="hail" role="dialog" aria-label="Milestone" hidden>
  <div class="hail-veil"></div>
  <div class="hail-card" id="hailCard"></div>
</div>

<!-- notebook -->
<div class="flash" id="notebook" role="dialog" aria-label="Notebook">
  <div class="flash-bar">
    <button class="icon-btn" id="nbClose" aria-label="Close notebook">✕</button>
    <span class="sv-title" id="nbTitle"></span>
  </div>
  <div class="flash-stage nb-stage" id="nbStage"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.1/dist/hanzi-writer.min.js"></script>
<script src="js/data.js?v=0.23.15"></script>
<script src="js/strokes.js?v=0.23.15"></script>
<script src="js/strokes-made.js?v=0.23.15"></script>
<!-- js/audio.js is deliberately not here. It is 859 KB gzipped of base64 speech
     that nothing needs in the first second, and as a blocking script it held up
     every view behind it. app.js fetches it after the first render. -->
<script src="js/srs.js?v=0.23.15"></script>
<!-- after srs.js, which owns the record it syncs, and inert until a Firebase
     project is configured at the top of the file -->
<script src="js/sync.js?v=0.23.15"></script>
<!-- before app.js: app.js builds its RENDER map at load and names renderSprint in it -->
<script src="js/sprint.js?v=0.23.15"></script>
<script src="js/app.js?v=0.23.15"></script>
